<!-- @dsCard group="Marketing Site" viewport="1280x2400" name="Homepage" subtitle="Hero, services, about, client proof, footer" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Sokndall — Marketing Site</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script>window.DS = window.SokndallDS || {};</script>
<style>html,body{margin:0}#root{min-height:100vh;min-width:1200px;background:var(--surface-page)}</style>
</head><body><div id="root"></div>
<script type="text/babel" src="Hero.jsx"></script>
<script type="text/babel" src="Services.jsx"></script>
<script type="text/babel" src="About.jsx"></script>
<script type="text/babel" src="Trusted.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>
<script type="text/babel">
const { NavBar, ScrollCue } = window.DS;
const ITEMS = ["Services","About Us","Blog","Pages","Contact"];
function App(){
  const [scrolled,setScrolled] = React.useState(false);
  React.useEffect(()=>{
    const el = document.scrollingElement;
    const on = () => setScrolled(el.scrollTop > 20);
    window.addEventListener('scroll',on,{passive:true});
    return ()=>window.removeEventListener('scroll',on);
  },[]);
  React.useEffect(()=>{ window.lucide && window.lucide.createIcons({attrs:{'stroke-width':1.75}}); });
  return <div>
    <div style={{position:'sticky',top:0,zIndex:20}}>
      <NavBar items={ITEMS} active="Services" transparent={!scrolled}/>
    </div>
    <window.Hero/>
    <div style={{display:'flex',justifyContent:'center',marginTop:-24,marginBottom:-24,position:'relative',zIndex:5}}>
      <ScrollCue onClick={()=>document.getElementById('services').scrollIntoView({behavior:'smooth'})}/>
    </div>
    <window.Services/>
    <window.About/>
    <window.Trusted/>
    <window.Footer/>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
