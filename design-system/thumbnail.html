<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>
  html,body{margin:0}
  .t{width:1280px;height:854px;display:flex;background:var(--gradient-dark)}
  .main{flex:1;display:grid;place-items:center}
  .wm{font:var(--fw-bold) 132px/1 var(--font-display);letter-spacing:.06em;text-transform:uppercase;color:#fff}
  .strip{width:300px;display:flex;flex-direction:column}
  .strip div{flex:1}
</style></head>
<body><div class="t">
  <div class="main"><div class="wm">Sokndall</div></div>
  <div class="strip">
    <div style="background:var(--gold-500)"></div>
    <div style="background:var(--forest-500)"></div>
    <div style="background:var(--forest-700)"></div>
    <div style="background:var(--forest-900)"></div>
  </div>
</div></body></html>
