<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:22px;background:var(--surface-page);font-family:var(--font-sans);margin:0}.row{display:flex;gap:14px;flex-wrap:wrap}.item{min-width:150px;padding:12px 14px;border-radius:var(--radius-md)}.n{font-size:13px;font-weight:600}.v{font-size:12px;opacity:.8;font-variant-numeric:tabular-nums}</style></head><body>
<div class="row">
<div class="item" style="background:var(--success-bg);color:var(--success-500)"><div class="n">success</div><div class="v">#3a6b3f on #e5f0d8</div></div>
<div class="item" style="background:var(--warning-bg);color:var(--warning-500)"><div class="n">warning</div><div class="v">#b3892c on #f7eccf</div></div>
<div class="item" style="background:var(--danger-bg);color:var(--danger-500)"><div class="n">danger</div><div class="v">#b4453c on #f6e4e2</div></div>
<div class="item" style="background:var(--info-bg);color:var(--info-500)"><div class="n">info</div><div class="v">#2f5d3f on #e4ede4</div></div>
</div>
</body></html>
