<!-- @dsCard group="Brand" viewport="760x170" name="Iconography" subtitle="Lucide line icons, 1.75 stroke, never filled" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<style>body{padding:24px;background:var(--surface-page);font-family:var(--font-sans);margin:0}.row{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.c{width:56px;height:56px;display:grid;place-items:center;background:var(--white);border-radius:999px;color:var(--forest-800);border:1px solid var(--border-card)}.tok{font-size:12px;color:var(--text-muted);margin-top:16px}</style></head><body>
<div class="row">
<div class="c"><i data-lucide="receipt"></i></div>
<div class="c"><i data-lucide="bar-chart-3"></i></div>
<div class="c"><i data-lucide="wallet"></i></div>
<div class="c"><i data-lucide="briefcase"></i></div>
<div class="c"><i data-lucide="phone"></i></div>
<div class="c"><i data-lucide="check"></i></div>
</div>
<div class="tok">System: Lucide (unpkg CDN) — a flagged substitution, no icon set shipped with the comp. Stroke 1.75. Colour: forest-800 inside white circles, white on forest, forest-600 in checks. Sizes: 22 in circles, 16 in buttons, 13 in check chips.</div>
<script>window.lucide&&window.lucide.createIcons({attrs:{'stroke-width':1.75}});</script>
</body></html>
