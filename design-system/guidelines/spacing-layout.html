<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:22px;background:var(--surface-page);font-family:var(--font-sans);margin:0}.tok{font-size:12px;color:var(--text-muted)}.diag{border:1px dashed var(--border-strong);border-radius:var(--radius-md);max-width:520px;padding:var(--space-6)}.bar{height:14px;background:var(--sage-200);border-radius:3px}.gap{height:var(--space-6)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--card-gap);margin-top:var(--space-4)}.cell{height:44px;background:var(--forest-100);border-radius:var(--radius-sm)}</style></head><body>
<div class="diag">
<div class="bar" style="width:40%"></div>
<div class="gap"></div>
<div class="bar" style="width:80%"></div>
<div class="grid"><div class="cell"></div><div class="cell"></div></div>
</div>
<div class="tok" style="margin-top:12px">--container-max 1200 · --page-x 40 · --section-y 104 (tight 64) · --card-pad 28 · --card-gap 24 · --nav-h 76. The header is desktop-only and scrolls rather than wraps.</div>
</body></html>
