<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{background:var(--surface-page);padding:22px;font-family:var(--font-sans)}#root{display:block}.lbl{font:var(--type-eyebrow);text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);margin-bottom:10px}.row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:22px}.dark{background:var(--gradient-dark);border-radius:var(--radius-lg);padding:22px}</style></head><body><div id="root"></div>
<script type="text/babel">
const {Button,ArrowLink,Pill,Badge,Card,IconCircle}=window.SokndallDS;
function Demo(){return <div className="col">
 <div><div className="lbl">Button — variants</div><div className="row">
  <Button arrow>Get Free Consultation</Button>
  <Button variant="gold" arrow>Schedule a Call</Button>
  <Button variant="outline">Watch Overview</Button>
  <Button variant="ghost">Cancel</Button>
  <Button disabled>Disabled</Button>
 </div></div>
 <div><div className="lbl">Button — sizes</div><div className="row">
  <Button size="sm" arrow>Small</Button><Button size="md" arrow>Medium</Button><Button size="lg" arrow>Large</Button>
 </div></div>
 <div className="dark"><div className="lbl" style={{color:'rgba(255,255,255,.6)'}}>On forest</div><div className="row">
  <Button variant="gold" arrow>Explore All Services</Button>
  <Button variant="onDark" arrow>More About Us</Button>
  <ArrowLink tone="onDark">Learn More</ArrowLink>
 </div></div>
 <div><div className="lbl">Pill · Badge · ArrowLink</div><div className="row" style={{gap:20}}>
  <Pill icon="🏆">Top-Rated Accounting &amp; Advisory Firm</Pill>
  <Badge tone="gold">Most Popular</Badge>
  <Badge tone="sage">Year-round</Badge>
  <ArrowLink>Learn More</ArrowLink>
 </div></div>
 <div><div className="lbl">Card · IconCircle</div><div className="row" style={{alignItems:'stretch'}}>
  <Card style={{width:230}}><h4 style={{font:'var(--type-h4)',margin:'0 0 8px'}}>Default card</h4><p style={{font:'var(--type-small)',color:'var(--text-body)',margin:0}}>Hairline border, 16px corners.</p></Card>
  <Card interactive style={{width:230}}><h4 style={{font:'var(--type-h4)',margin:'0 0 8px'}}>Interactive</h4><p style={{font:'var(--type-small)',color:'var(--text-body)',margin:0}}>Lifts 3px on hover.</p></Card>
  <IconCircle icon="receipt"/><IconCircle icon="wallet" tone="sage"/><IconCircle icon="briefcase" tone="gold"/>
 </div></div>
</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
<script>setTimeout(function(){window.lucide&&window.lucide.createIcons({attrs:{"stroke-width":1.75}});},80);</script></body></html>
