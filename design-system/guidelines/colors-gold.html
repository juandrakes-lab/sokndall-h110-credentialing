<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:22px;background:var(--surface-page);font-family:var(--font-sans);margin:0}.lbl{font:var(--type-eyebrow);text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);margin:0 0 10px}.row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}.sw{width:120px}.chip{height:60px;border-radius:var(--radius-md);border:1px solid rgba(20,40,29,.08)}.n{font-size:13px;font-weight:600;color:var(--text-heading);margin-top:8px}.v{font-size:12px;color:var(--text-muted);font-variant-numeric:tabular-nums}.tok{font-size:12px;color:var(--text-muted);margin-top:12px}</style></head><body>
<div class="row">
<div class="sw"><div class="chip" style="background:var(--gold-300)"></div><div class="n">gold-300</div><div class="v">#f2d489</div></div>
<div class="sw"><div class="chip" style="background:var(--gold-400)"></div><div class="n">gold-400</div><div class="v">#edc76a</div></div>
<div class="sw"><div class="chip" style="background:var(--gold-500)"></div><div class="n">gold-500</div><div class="v">#e8b84b</div></div>
<div class="sw"><div class="chip" style="background:var(--gold-600)"></div><div class="n">gold-600</div><div class="v">#d4a53a</div></div>
<div class="sw"><div class="chip" style="background:var(--gold-700)"></div><div class="n">gold-700</div><div class="v">#b3892c</div></div>
</div>
<div class="tok">--gold-500 fills the single most important action on a page (Schedule a Call, Explore All Services). --gold-600 hover, --gold-700 press. Text on gold is --ink-900.</div>
</body></html>
