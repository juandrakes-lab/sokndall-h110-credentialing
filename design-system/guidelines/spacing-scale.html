<!-- @dsCard group="Spacing" viewport="760x180" name="Spacing scale" subtitle="4px base, doubling through the mid-range" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:22px;background:var(--surface-page);font-family:var(--font-sans);margin:0}.row{display:flex;align-items:flex-end;gap:10px}.b{background:var(--forest-300);border-radius:3px}.v{font-size:11px;color:var(--text-muted);text-align:center;margin-top:6px}.tok{font-size:12px;color:var(--text-muted);margin-top:14px}</style></head><body>
<div class="row">
<div><div class="b" style="width:var(--space-1);height:var(--space-1)"></div><div class="v">1·4</div></div>
<div><div class="b" style="width:var(--space-2);height:var(--space-2)"></div><div class="v">2·8</div></div>
<div><div class="b" style="width:var(--space-3);height:var(--space-3)"></div><div class="v">3·12</div></div>
<div><div class="b" style="width:var(--space-4);height:var(--space-4)"></div><div class="v">4·16</div></div>
<div><div class="b" style="width:var(--space-5);height:var(--space-5)"></div><div class="v">5·20</div></div>
<div><div class="b" style="width:var(--space-6);height:var(--space-6)"></div><div class="v">6·24</div></div>
<div><div class="b" style="width:var(--space-7);height:var(--space-7)"></div><div class="v">7·32</div></div>
<div><div class="b" style="width:var(--space-8);height:var(--space-8)"></div><div class="v">8·40</div></div>
<div><div class="b" style="width:var(--space-9);height:var(--space-9)"></div><div class="v">9·48</div></div>
<div><div class="b" style="width:var(--space-11);height:var(--space-11)"></div><div class="v">11·64</div></div>
<div><div class="b" style="width:var(--space-12);height:var(--space-12)"></div><div class="v">12·80</div></div>
</div>
<div class="tok">--space-1 4px … --space-14 120px. Component gaps use 3–5; section rhythm uses 13.</div>
</body></html>
