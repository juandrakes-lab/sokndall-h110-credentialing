<!-- @dsCard group="Colors" viewport="760x200" name="Ink & neutrals" subtitle="Warm, faintly green-grey text on off-white surfaces" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:22px;background:var(--surface-page);font-family:var(--font-sans);margin:0}.lbl{font:var(--type-eyebrow);text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);margin:0 0 10px}.row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}.sw{width:120px}.chip{height:60px;border-radius:var(--radius-md);border:1px solid rgba(20,40,29,.08)}.n{font-size:13px;font-weight:600;color:var(--text-heading);margin-top:8px}.v{font-size:12px;color:var(--text-muted);font-variant-numeric:tabular-nums}.tok{font-size:12px;color:var(--text-muted);margin-top:12px}</style></head><body>
<div class="row">
<div class="sw"><div class="chip" style="background:var(--ink-900)"></div><div class="n">ink-900</div><div class="v">#1a1f1c</div></div>
<div class="sw"><div class="chip" style="background:var(--ink-700)"></div><div class="n">ink-700</div><div class="v">#37413a</div></div>
<div class="sw"><div class="chip" style="background:var(--ink-500)"></div><div class="n">ink-500</div><div class="v">#5b6660</div></div>
<div class="sw"><div class="chip" style="background:var(--ink-400)"></div><div class="n">ink-400</div><div class="v">#7c877f</div></div>
<div class="sw"><div class="chip" style="background:var(--ink-300)"></div><div class="n">ink-300</div><div class="v">#a3ada6</div></div>
<div class="sw"><div class="chip" style="background:var(--ink-200)"></div><div class="n">ink-200</div><div class="v">#c9d0ca</div></div>
<div class="sw"><div class="chip" style="background:var(--ink-100)"></div><div class="n">ink-100</div><div class="v">#e4e8e3</div></div>
<div class="sw"><div class="chip" style="background:var(--ink-050)"></div><div class="n">ink-050</div><div class="v">#eef2ec</div></div>
<div class="sw"><div class="chip" style="background:var(--paper)"></div><div class="n">paper</div><div class="v">#f6f8f3</div></div>
<div class="sw"><div class="chip" style="background:var(--white)"></div><div class="n">white</div><div class="v">#ffffff</div></div>
</div>
<div class="tok">Two surface values only: --paper for the page, --white for cards. --ink-900 headings, --ink-500 body, --ink-400 muted.</div>
</body></html>
