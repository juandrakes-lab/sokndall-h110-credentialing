<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{background:var(--surface-page);padding:22px;font-family:var(--font-sans)}#root{display:block}.lbl{font:var(--type-eyebrow);text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);margin-bottom:10px}.row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:22px}.dark{background:var(--gradient-dark);border-radius:var(--radius-lg);padding:22px}</style></head><body><div id="root"></div>
<script type="text/babel">
const {NavBar,ScrollCue}=window.SokndallDS;
const ITEMS=["Services","About Us","Blog","Pages","Contact"];
function Demo(){return <div className="col">
 <div style={{background:'var(--gradient-hero)'}}><NavBar items={ITEMS} active="Services" transparent={true}/></div>
 <NavBar items={ITEMS} active="Services" transparent={false}/>
 <div className="row"><ScrollCue/></div>
</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
<script>setTimeout(function(){window.lucide&&window.lucide.createIcons({attrs:{"stroke-width":1.75}});},80);</script></body></html>
