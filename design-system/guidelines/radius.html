<!-- @dsCard group="Brand" viewport="760x160" name="Corner radii" subtitle="Near-square buttons, soft 16px cards, round only for pills and icon circles" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:22px;background:var(--surface-page);font-family:var(--font-sans);margin:0}.row{display:flex;gap:16px;flex-wrap:wrap}.sw{width:120px}.box{height:60px;background:var(--white);border:1px solid var(--border-card);box-shadow:var(--shadow-card)}.n{font-size:13px;font-weight:600;color:var(--text-heading);margin-top:8px}.v{font-size:12px;color:var(--text-muted)}</style></head><body>
<div class="row">
<div class="sw"><div class="box" style="border-radius:var(--radius-button)"></div><div class="n">Button</div><div class="v">6px</div></div>
<div class="sw"><div class="box" style="border-radius:var(--radius-input)"></div><div class="n">Input</div><div class="v">8px</div></div>
<div class="sw"><div class="box" style="border-radius:var(--radius-image)"></div><div class="n">Image</div><div class="v">14px</div></div>
<div class="sw"><div class="box" style="border-radius:var(--radius-card)"></div><div class="n">Card</div><div class="v">16px</div></div>
<div class="sw"><div class="box" style="border-radius:var(--radius-pill)"></div><div class="n">Pill / circle</div><div class="v">999px</div></div>
</div>
</body></html>
